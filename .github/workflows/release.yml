# Runs in the public Translate plugin mirror when a release tag is pushed by the private repository's sync, or by hand.
# Packs plugin.json and the published plugin assembly into a GitHub Release archive installable from /plugins.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 or 0.1.0-rc.1.'
        required: true
        type: string

permissions:
  contents: read

env:
  RAW_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version and tag
        id: meta
        run: |
          version="${RAW_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$RAW_VERSION' (expected X.Y.Z or X.Y.Z-prerelease)." >&2
            exit 1
          fi
          tag="v$version"
          existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "Tag $tag is already on $existing, not on $GITHUB_SHA" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish plugin package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          dotnet publish src/NE.ChatAI.Plugins.Translate/NE.ChatAI.Plugins.Translate.csproj \
            --configuration Release \
            -p:Version="$VERSION" \
            --output ./artifacts/package
          python3 -c '
          import json, os
          p = "./artifacts/package/plugin.json"
          with open(p, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = os.environ["VERSION"]
          data["repository"] = os.environ["GITHUB_REPOSITORY"]
          with open(p, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          '
          cp ./artifacts/package/plugin.json ./artifacts/plugin.json
          (cd ./artifacts/package && zip -qr "../ne-chatai-translate-$TAG.zip" .)

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [ -z "$existing" ]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          prerelease=""
          if [ "${VERSION#*-}" != "$VERSION" ]; then
            prerelease="--prerelease"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" \
              ./artifacts/plugin.json \
              "./artifacts/ne-chatai-translate-$TAG.zip" \
              --clobber
          else
            gh release create "$TAG" \
              ./artifacts/plugin.json \
              "./artifacts/ne-chatai-translate-$TAG.zip" \
              --title "$TAG" \
              --generate-notes \
              $prerelease
          fi
